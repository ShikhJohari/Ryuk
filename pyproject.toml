[project]
name = "ryuk"
version = "0.1.0"
description = "Watchlist face recognition with measured recognition models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5",
    "opencv-python-headless>=5.0.0.93",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ryuk = "ryuk.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ipykernel>=7.3.0",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6",
    "quarto-cli>=1.10.18",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "PL", "C4", "RET", "PTH", "TRY", "ANN"]
ignore = ["TRY003", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "ANN", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=ryuk", "--cov-report=term-missing", "--cov-fail-under=85"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ryuk"]
# CLI entry-point wrappers are thin shells over tested code (#18).
omit = ["src/ryuk/cli.py", "src/ryuk/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
