[project]
name = "ryuk"
version = "0.1.0"
description = "Watchlist face recognition with measured recognition models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "facenet-pytorch==2.5.3",
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
ryuk = "ryuk.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ipykernel>=7.3.0",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6",
    "quarto-cli>=1.10.18",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv.sources]
# Linux (CI) takes the CPU-only wheels; the default PyPI torch pulls several GB of CUDA libraries.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "PL", "C4", "RET", "PTH", "TRY", "ANN"]
ignore = ["TRY003", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "ANN", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Neither ships type information; both are wrapped behind the recognition model interface.
module = ["onnxruntime", "facenet_pytorch.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The weights smoke tests need the real weights; CI's weights-smoke job runs them with `-m smoke`.
addopts = [
    "--strict-markers",
    "-m",
    "not smoke",
    "--cov=ryuk",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = ["smoke: needs the real model weights (ryuk weights fetch); run with -m smoke"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ryuk"]
# CLI entry-point wrappers are thin shells over tested code (#18).
omit = ["src/ryuk/cli.py", "src/ryuk/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
