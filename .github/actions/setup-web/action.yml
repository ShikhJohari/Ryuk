name: Set up the web client
description: Node, pnpm (version from web/package.json) and the client's dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0 # v6 tag is stale (pnpm/action-setup#289); pnpm 12 needs 6.1.0
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web
